[project]
name = "repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hrishikesh-kakade", email = "hrishikeshkakade33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.34.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110",
    "groq>=0.11.0",
    "ipykernel>=7.4.0",
    "numpy>=1.26",
    "openai>=1.30.0",
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "sentence-transformers>=2.6.0",
    "streamlit>=1.32",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
repo = "repo:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
